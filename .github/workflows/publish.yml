name: Publish to PyPI & Release

on:
  push:
    tags:
      - "v*"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test:
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=90 -v -m ""

  # RabbitMQ 集成测试：GitHub Actions 服务启动真实 broker，跑跨进程 EventQueue
  # （queues/rabbit）的 slow 集成测试。发布前必须真实跑过——无 broker 时该模块会
  # 整模块 skip，上面的 test job（-m ""）无法覆盖它。
  integration-rabbitmq:
    needs: pre-commit
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
        ports:
          - 5672:5672
    env:
      RABBITMQ_URL: amqp://ci:ci@127.0.0.1:5672/

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra test

      - name: Wait for RabbitMQ
        run: |
          uv run python - <<'EOF'
          import socket, time
          for _ in range(30):
              if socket.socket().connect_ex(("127.0.0.1", 5672)) == 0:
                  print("rabbit ready")
                  break
              time.sleep(1)
          else:
              raise SystemExit("RabbitMQ not ready")
          EOF

      - name: Run RabbitMQ integration tests
        run: uv run pytest tests/templates/queues/rabbit/ -m slow -v

  build-and-publish:
    needs: [test, integration-rabbitmq]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        run: uv publish
